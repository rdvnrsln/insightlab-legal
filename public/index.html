<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightLab - Yasal Dökümanlar</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            color: #333;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
        }

        .links {
            margin: 40px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .link-card {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px 40px;
            text-decoration: none;
            color: #2c3e50;
            transition: all 0.3s;
            width: 100%;
            max-width: 400px;
        }

        .link-card:hover {
            background: #e9ecef;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .link-card h2 {
            margin: 0 0 10px 0;
            color: #3498db;
        }

        .link-card p {
            margin: 0;
            color: #6c757d;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h1>InsightLab</h1>
    <p>Çocuk Gelişimi Takip Uygulaması</p>

    <div class="links">
        <a href="privacy.html" class="link-card">
            <h2>Gizlilik Politikası</h2>
            <p>Verilerinizin nasıl toplandığı ve korunduğu hakkında bilgi</p>
        </a>

        <a href="eula.html" class="link-card">
            <h2>Kullanım Koşulları (EULA)</h2>
            <p>Uygulama kullanım şartları ve lisans bilgileri</p>
        </a>
    </div>

    <p style="color: #7f8c8d; margin-top: 60px;">
        © 2026 InsightLab. Tüm hakları saklıdır.
    </p>
</body>

</html>
